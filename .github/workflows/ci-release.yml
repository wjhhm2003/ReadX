name: ReadX CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Fork PRs only receive a read-only token. Signing and publishing run on main only.
permissions:
  contents: read

# Keep every main push; only superseded runs of the same PR are cancelled.
concurrency:
  group: readx-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: '17'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  verify:
    name: Tests and lint (API 36)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36.1 build-tools;36.0.0
      - name: Set up Gradle (GitHub cache only)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: Test delivery tooling, run JVM tests and lint, compile device tests
        run: |
          chmod +x gradlew
          python3 -m unittest discover -s scripts/tests -v
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable KVM on the disposable CI runner
        run: |
          sudo chown "$USER" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run instrumentation tests on a disposable API 36 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
      - name: Upload test and lint reports even after a failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Signed ordinary Preview
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36.1 build-tools;36.0.0
      - name: Set up Gradle (read-only GitHub cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Restore the dedicated CI Preview signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.READX_CI_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing READX_CI_PREVIEW_KEYSTORE_BASE64 repository secret'; exit 1; }
          umask 077
          key_path="$RUNNER_TEMP/readx-ci-preview.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
          keytool -list -keystore "$key_path" -storepass android -alias androiddebugkey > /dev/null
          echo "READX_CI_PREVIEW_KEYSTORE=$key_path" >> "$GITHUB_ENV"
      - name: Build and stage the ordinary Preview
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assemblePreview -PbundledOcr=false \
            "-PciVersionCode=$((100000 + GITHUB_RUN_NUMBER))" "-PciVersionSuffix=-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          python3 scripts/package-ci-release.py stage
      # R8 is finished before starting this disposable CI emulator.
      - name: Enable KVM on the disposable CI runner
        run: sudo chown "$USER" /dev/kvm
      - name: Install and launch the actual minified Preview on API 36
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r build/ci/release/app-preview.apk
            adb shell am start -W -n io.readx.app/.MainActivity | tee build/ci/reports/preview-launch.txt
            grep -q '^Status: ok' build/ci/reports/preview-launch.txt
            adb shell pidof io.readx.app
            adb logcat -b crash -d > build/ci/reports/preview-crash.txt
            if grep -q 'Process: io.readx.app' build/ci/reports/preview-crash.txt; then exit 1; fi
      - name: Verify APK signatures and generate release manifest
        run: |
          signer="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          certificate_sha256=$(keytool -exportcert -keystore "$READX_CI_PREVIEW_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          for apk in build/ci/release/*.apk; do
            "$signer" verify --verbose --print-certs "$apk" | tee "build/ci/reports/$(basename "$apk").signature.txt"
            grep -Fq "Signer #1 certificate SHA-256 digest: $certificate_sha256" "build/ci/reports/$(basename "$apk").signature.txt"
          done
          python3 scripts/package-ci-release.py finalize --certificate-sha256 "$certificate_sha256"
      - name: Upload final release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload signature, startup and R8 reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaging-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci/reports/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/readx-ci-preview.keystore"

  publish:
    name: Publish GitHub prerelease
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No build scripts or Gradle run in the job with release-write permission.
      - name: Download the tested and signed release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Check downloaded files and read release identity
        id: release
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          info = json.loads(Path('build-info.json').read_text())
          assert info['commit'] == os.environ['GITHUB_SHA'], 'Release revision mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"tag={info['tag']}\ntitle={info['title']}\n")
          PY
      - name: Upload all assets to a draft, then publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --latest=false \
            --title "$RELEASE_TITLE" --notes-file release/release-notes.md \
            release/app-preview.apk release/SHA256SUMS.txt release/build-info.json release/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          echo "### Published $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
